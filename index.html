<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluguel de Axies do Fuly</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1 data-i18n="title">🐾 Aluguel de Axies do Fuly</h1>
  <div class="lang-switcher">
    <button class="lang-btn flag-pt" data-lang="pt" title="Português"><span class="flag-accent"></span><span class="flag-label">BR</span></button>
    <button class="lang-btn flag-en" data-lang="en" title="English"><span class="flag-accent"></span><span class="flag-label">EN</span></button>
    <button class="lang-btn flag-es" data-lang="es" title="Español"><span class="flag-accent"></span><span class="flag-label">ES</span></button>
    <button class="lang-btn flag-fil" data-lang="fil" title="Filipino"><span class="flag-accent"></span><span class="flag-label">FIL</span></button>
  </div>
  <div class="stats-wrap">
    <div class="stats">
      <span id="statTotal">0</span> <span data-i18n="statTotalLabel"></span> ·
      <span id="statDisponivel">0</span> <span data-i18n="statAvailableLabel"></span> ·
      <span id="statAlugado">0</span> <span data-i18n="statRentedLabel"></span>
    </div>
    <div id="statsByOwner" class="stats-by-owner"></div>
  </div>
  <div id="accountInfo" class="account-info" style="display:none"></div>
  <button id="lockBtn" class="lock-btn"></button>
</header>

<div id="associatesBanner" class="associates-banner"></div>

<div class="promo-banner">
  <div class="promo-half">
    <img class="promo-ticket-img" src="ticket-morph.png" alt="Tiquete de Morph - US$ 1">
    <div class="promo-text">
      <div class="promo-title" data-i18n="promoTicketTitle"></div>
      <div class="promo-subtitle" data-i18n="promoTicketSubtitle"></div>
    </div>
  </div>
  <div class="promo-divider"></div>
  <div class="promo-half">
    <img class="promo-ticket-img" src="slips.png" alt="Fortune Slips">
    <div class="promo-text">
      <div class="promo-title" data-i18n="slipsLabel"></div>
      <div class="promo-subtitle">1.000 <span data-i18n="slipsFor"></span> US$ 4 — <span data-i18n="slipsContactSuffix"></span></div>
    </div>
  </div>
</div>

<section class="price-section">
  <h2 class="price-title" data-i18n="priceTableTitle"></h2>
  <div class="price-note" data-i18n="priceTableNote"></div>
  <div class="price-table" id="priceTable"></div>
</section>

<div id="lockModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3 data-i18n="lockModalTitle"></h3>
    <p data-i18n="lockModalDesc"></p>
    <input type="email" id="loginEmailInput" data-i18n-placeholder="loginEmailPlaceholder" autocomplete="username">
    <input type="password" id="lockPasswordInput" data-i18n-placeholder="lockPasswordPlaceholder" autocomplete="current-password">
    <div class="modal-error" id="lockError" style="display:none" data-i18n="lockErrorText"></div>
    <div class="modal-actions">
      <button id="lockCancel" class="modal-btn secondary" data-i18n="cancelBtn"></button>
      <button id="lockConfirm" class="modal-btn primary" data-i18n="enterBtn"></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<div class="view-tabs">
  <button class="view-tab active" id="tabStandard" data-view="standard" data-i18n="tabStandard"></button>
  <button class="view-tab" id="tabMorph" data-view="morph" data-i18n="tabMorph"></button>
  <button class="view-tab" id="tabTop100" data-view="top100">🏆 Top 100</button>
</div>

<section class="filters">
  <div class="filter-group">
    <label data-i18n="searchLabel"></label>
    <input type="text" id="searchId" data-i18n-placeholder="searchPlaceholder">
  </div>

  <div class="filter-group">
    <label data-i18n="classLabel"></label>
    <select id="filterClass">
      <option value="" data-i18n="optAll"></option>
    </select>
  </div>

  <div class="filter-group">
    <label data-i18n="statusLabel"></label>
    <select id="filterStatus">
      <option value="" data-i18n="optAll"></option>
      <option value="disponivel" data-i18n="optAvailable"></option>
      <option value="alugado" data-i18n="optRented"></option>
    </select>
  </div>

  <div class="filter-group">
    <label data-i18n="collectibleLabel"></label>
    <select id="filterCollectibleTag">
      <option value="" data-i18n="optAll"></option>
    </select>
  </div>

  <div class="filter-group filter-available-group">
    <button type="button" id="filterAvailableBtn" class="filter-available-btn" data-i18n="filterAvailableBtn"></button>
  </div>

  <div class="filter-group filter-checkbox">
    <label>
      <input type="checkbox" id="filterShowAll">
      <span data-i18n="showAllLabel"></span>
    </label>
  </div>

</section>

<main id="grid" class="grid"></main>

<section id="top100" class="top100-section" style="display:none">
  <div class="top100-header">
    <h2 id="top100Title"></h2>
    <div id="top100Updated" class="top100-updated"></div>
  </div>
  <div class="top100-selector-row">
    <label data-i18n="top100SeasonSelectLabel"></label>
    <select id="top100SeasonSelect"></select>
  </div>
  <div id="top100List" class="top100-list"></div>
</section>

<footer class="foot" data-i18n="footerText"></footer>

<script src="axie-renderer.bundle.js"></script>
<script src="data.js"></script>
<script src="top100.js"></script>
<script src="partners.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
